<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>PWA Contact Manager</title>

    <link rel="manifest" href="manifest.json" />

    <meta name="theme-color" content="#2563eb" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="mobile-web-app-capable" content="yes" />

    <style>
      body {
        font-family: Arial;
        margin: 20px;
        background: #f3f4f6;
      }

      .top {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 15px;
      }

      button {
        padding: 10px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: #2563eb;
        color: white;
      }

      table {
        width: 100%;
        background: white;
        border-collapse: collapse;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 10px;
      }

      th {
        background: #2563eb;
        color: white;
      }

      .fab {
        position: fixed;
        bottom: 20px;
        right: 20px;

        width: 60px;
        height: 60px;

        border-radius: 50%;
        font-size: 28px;
      }

      .modal {
        display: none;

        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        background: rgba(0, 0, 0, 0.5);

        justify-content: center;
        align-items: center;
      }

      .box {
        background: white;

        padding: 20px;

        width: 300px;

        border-radius: 10px;
      }

      input {
        width: 100%;
        padding: 8px;

        margin-bottom: 10px;
      }
    </style>
  </head>

  <body>
    <h2>PWA Contact Manager</h2>

    <div class="top">
      <button onclick="syncDrive()">Sync Drive</button>

      <button onclick="fetchDrive()">Fetch Drive</button>

      <button onclick="exportCSV()">Export CSV</button>

      <button onclick="csv.click()">Import CSV</button>

      <input id="csv" type="file" hidden />
    </div>

    <table>
      <thead>
        <tr>
          <th>Sl</th>

          <th>Name</th>

          <th>Contact</th>

          <th>City</th>
        </tr>
      </thead>

      <tbody id="tbody"></tbody>
    </table>

    <button class="fab" onclick="openModal()">+</button>

    <div class="modal" id="modal">
      <div class="box">
        <input id="name" placeholder="Name" />

        <input id="contact" placeholder="Contact" />

        <input id="city" placeholder="City" />

        <button onclick="saveData()">Save</button>
      </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("service-worker.js");
      }

      let db;

      let accessToken = localStorage.getItem("driveToken") || "";

      let expiry = Number(localStorage.getItem("driveExpiry")) || 0;

      const CLIENT_ID = "1052784534817-j81960tfqri6j1gv4at83rr8f460hm19.apps.googleusercontent.com";

      const open = indexedDB.open("ContactDB", 1);

      open.onupgradeneeded = (e) => {
        db = e.target.result;

        db.createObjectStore(
          "contacts",

          {
            keyPath: "uuid",
          },
        );
      };

      open.onsuccess = (e) => {
        db = e.target.result;

        load();
      };

      function tx(mode) {
        return db.transaction("contacts", mode).objectStore("contacts");
      }

      function openModal() {
        modal.style.display = "flex";
      }

      function closeModal() {
        modal.style.display = "none";
      }

      function saveData() {
        const data = {
          uuid: crypto.randomUUID(),

          name: name.value,

          contact: contact.value,

          city: city.value,

          updated: Date.now(),
        };

        tx("readwrite").put(data);

        closeModal();

        setTimeout(load, 100);
      }

      function load() {
        tbody.innerHTML = "";

        tx("readonly").getAll().onsuccess = (e) => {
          e.target.result

            .sort((a, b) => b.updated - a.updated)

            .forEach((x, i) => {
              tbody.innerHTML += `

<tr>

<td>
${i + 1}
</td>

<td>
${x.name}
</td>

<td>
${x.contact}
</td>

<td>
${x.city}
</td>

</tr>

`;
            });
        };
      }

      function exportCSV() {
        tx("readonly").getAll().onsuccess = (e) => {
          let csv = "Name,Contact,City\n";

          e.target.result.forEach((x) => {
            csv += `${x.name},
${x.contact},
${x.city}\n`;
          });

          const blob = new Blob([csv]);

          const a = document.createElement("a");

          a.href = URL.createObjectURL(blob);

          a.download = "contacts.csv";

          a.click();
        };
      }

      csv.onchange = (e) => {
        const file = e.target.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = (x) => {
          const rows = x.target.result

            .split("\n")

            .slice(1);

          const store = tx("readwrite");

          rows.forEach((r) => {
            if (!r) return;

            const c = r.split(",");

            store.put({
              uuid: crypto.randomUUID(),

              name: c[0],

              contact: c[1],

              city: c[2],

              updated: Date.now(),
            });
          });

          setTimeout(load, 500);
        };

        reader.readAsText(file);
      };

      async function auth() {
        if (accessToken && Date.now() < expiry) {
          return;
        }

        return new Promise((resolve) => {
          google.accounts.oauth2

            .initTokenClient({
              client_id: CLIENT_ID,

              scope: "https://www.googleapis.com/auth/drive.file",

              callback: (r) => {
                accessToken = r.access_token;

                expiry = Date.now() + r.expires_in * 1000;

                localStorage.setItem(
                  "driveToken",

                  accessToken,
                );

                localStorage.setItem(
                  "driveExpiry",

                  expiry,
                );

                resolve();
              },
            })

            .requestAccessToken();
        });
      }

      async function fileId() {
        const r = await fetch(
          "https://www.googleapis.com/drive/v3/files?q=name='contacts_backup.json'",

          {
            headers: {
              Authorization: "Bearer " + accessToken,
            },
          },
        );

        const j = await r.json();

        if (j.files && j.files.length) {
          return;

          j.files[0].id;
        }

        return null;
      }

      async function syncDrive() {
        await auth();

        tx("readonly").getAll().onsuccess = async (e) => {
          const data = JSON.stringify(e.target.result);

          const id = await fileId();

          const meta = {
            name: "contacts_backup.json",
          };

          const form = new FormData();

          form.append(
            "metadata",

            new Blob(
              [JSON.stringify(meta)],

              {
                type: "application/json",
              },
            ),
          );

          form.append(
            "file",

            new Blob(
              [data],

              {
                type: "application/json",
              },
            ),
          );

          let url = "https://www.googleapis.com/upload/drive/v3/files";

          let method = "POST";

          if (id) {
            url += "/" + id + "?uploadType=multipart";

            method = "PATCH";
          } else {
            url += "?uploadType=multipart";
          }

          await fetch(
            url,

            {
              method,

              headers: {
                Authorization: "Bearer " + accessToken,
              },

              body: form,
            },
          );

          alert("Synced");
        };
      }

      async function fetchDrive() {
        await auth();

        const id = await fileId();

        if (!id) {
          alert("No backup");

          return;
        }

        const r = await fetch(
          `https://www.googleapis.com/drive/v3/files/${id}?alt=media`,

          {
            headers: {
              Authorization: "Bearer " + accessToken,
            },
          },
        );

        const data = await r.json();

        const store = tx("readwrite");

        data.forEach((x) => store.put(x));

        setTimeout(
          load,

          500,
        );

        alert("Fetched");
      }
    </script>
  </body>
</html>
